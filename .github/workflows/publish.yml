name: publish

# Publishes to npm with build provenance. Authenticates with the NPM_TOKEN
# automation token (repo secret); provenance attestation still uses OIDC (id-token).
# Triggered ONLY by a GitHub Release published by release-please.
# Never publish from a local machine; never bump the version by hand.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
