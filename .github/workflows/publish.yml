name: publish

# Publishes to npm using **Trusted Publishing (OIDC)** — no NPM_TOKEN, nothing to expire.
# Provenance is attested from the same OIDC identity.
#
# This workflow is `workflow_call`-only ON PURPOSE. npm authorises the *entry-point*
# workflow of a run, not the workflow that actually contains `npm publish`:
#
#   "validation checks the calling workflow's name instead of the workflow that
#    actually contains the publish command"  — https://docs.npmjs.com/trusted-publishers/
#
# So every publish must enter through release-please.yml, which is the single workflow
# registered as the trusted publisher on npmjs.com. Adding `on: release` or
# `on: workflow_dispatch` back here would create a second entry point that npm would
# refuse to authorise (it surfaces as a confusing 404 on publish).
#
# `id-token: write` is required on BOTH parent and child — see the caller's job perms.

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to publish (e.g. v0.2.5)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Publish exactly the released commit, not whatever ref triggered the run.
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 22.x is 10.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Makes re-publishing a tag safe: npm hard-fails on an existing version, which
      # would otherwise turn a harmless recovery run red.
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Resolved $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: auth is the OIDC token minted from id-token: write.
      - name: Publish with provenance
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public
